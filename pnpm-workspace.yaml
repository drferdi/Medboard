# Capsule standalone: workspace pnpm milik medboard sendiri, lockfile di folder ini.
packages: []

# Kontrak standalone menolak symlink di pohon capsule; linker hoisted membuat
# node_modules datar tanpa symlink.
nodeLinker: hoisted

# pnpm 11 wajib keputusan eksplisit. Prisma (engine dan client), esbuild, dan
# sharp butuh build script; @sentry/cli hanya untuk unggah sourcemap, tidak dipakai.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@sentry/cli': false

# Advisori keamanan (pnpm audit 2026-10-07 + 2026-10-11):
# - next 16.3.8 (direct): Image Optimization SSRF (GHSA-cjq9-62q9-8jv4)
# - sharp / source-map-js / postcss: transitif lewat next/@sentry/nextjs
# - deepmerge-ts / effect: lewat @prisma/config
# - maplibre-gl 6.13.0 (direct): XSS sanitizer bypass (GHSA-jrc7-96c5-q579; need >=6.4.1)
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  deepmerge-ts: ">=8.0.1"
  effect: ">=3.20.0"
